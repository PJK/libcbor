# Checks that every file declares its copyright and license in SPDX form, either
# in a header or in REUSE.toml (https://reuse.software).
name: REUSE compliance
on: [push, pull_request]
jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Lint
      run: pipx run --spec reuse==6.2.0 reuse lint
